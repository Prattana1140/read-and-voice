services:
  - type: web
    name: read-and-voice-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "30"
      - key: PAYMENT_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: PAYMENT_RATE_LIMIT_MAX
        value: "60"
      - key: API_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: EMAIL_FROM_NAME
        value: Read and Voice
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: PASSWORD_RESET_EMAIL_WEBHOOK_URL
        sync: false
      - key: PASSWORD_RESET_EMAIL_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_TEST_TO
        sync: false
      - key: ALLOW_PASSWORD_RESET_PREVIEW
        value: "false"
      - key: MANUAL_PAYMENT_ENABLED
        value: "true"
      - key: MANUAL_PAYMENT_INSTRUCTIONS
        value: "กรุณาโอนเงินตามช่องทางที่แอดมินแจ้ง แล้วส่งหลักฐานพร้อมเลขรายการ {topup_id} จำนวน {amount} บาท"
      - key: PAYMENT_CHECKOUT_URL_TEMPLATE
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: ENABLE_OCR
        value: "true"
      - key: OCR_PYTHON_COMMAND
        value: python3
      - key: OCR_ENGINE
        value: auto
      - key: PADDLEOCR_LANG
        value: th
      - key: PADDLEOCR_MIN_SCORE
        value: "0.35"
      - key: PADDLEOCR_DPI
        value: "260"
      - key: OCR_LANG
        value: tha+eng
      - key: TESSERACT_COMMAND
        value: tesseract
      - key: OCR_CONCURRENCY
        value: "3"
      - key: OCR_RENDER_SCALE
        value: "2"
      - key: ENABLE_STT
        value: "false"
      - key: STT_COMMAND
        sync: false
      - key: STT_ARGS
        sync: false
      - key: STT_HEALTHCHECK_ARGS
        sync: false
      - key: STT_LANGUAGE
        value: th
